<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#17181c;--mute:#6b6e76;--line:#dcd8ce;--acc:#e4372c;--btn:#1f4fe0;--btn-t:#fff;--note:#e3efe6;--note-t:#1d5a34;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121316;--card:#1b1c21;--ink:#f2f2f4;--mute:#9a9da6;--line:#2c2e35;--acc:#ff5a4d;--btn:#2d5cf0;--note:#10302a;--note-t:#7fe0a8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121316;--card:#1b1c21;--ink:#f2f2f4;--mute:#9a9da6;--line:#2c2e35;--acc:#ff5a4d;--btn:#2d5cf0;--note:#10302a;--note-t:#7fe0a8;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
header{position:relative;text-align:center;padding:22px 16px 10px}
.logo{font-size:26px;font-weight:800;letter-spacing:.06em;margin:0}
.logo{display:flex;align-items:center;justify-content:center;gap:12px}.mark{width:64px;height:64px;border-radius:16px;object-fit:cover;background:#fff}.cover{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.post .cover{border-radius:14px}
nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:6px 12px 14px;border-bottom:1px solid var(--line)}
nav a{color:var(--ink);text-decoration:none;padding:8px 14px;border-radius:99px;font-weight:600;font-size:15px}
nav a:hover,nav a:focus-visible{background:var(--card);outline:2px solid var(--acc)}
main{max-width:680px;margin:0 auto;padding:16px}
.note{background:var(--note);color:var(--note-t);border-radius:12px;padding:14px 16px;text-align:center;font-size:15px;margin-bottom:18px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px;text-decoration:none;color:inherit}
.card:focus-visible{outline:2px solid var(--acc)}
.thumb{aspect-ratio:16/9;display:flex;align-items:flex-end;padding:14px;color:#fff;font-weight:800;font-size:22px;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.card h2{font-size:18px;margin:14px 16px 2px;line-height:1.3}
.card p{margin:0 16px 14px;color:var(--mute);font-size:14px}
.post h1{font-size:22px;line-height:1.3;margin:0 0 12px}
.post .thumb{border-radius:14px}
.date{color:var(--mute);font-size:14px;margin:12px 0}
.info{list-style:none;padding:0;margin:0 0 18px}
.info li{padding:4px 0}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.box h3{margin:0 0 10px;font-size:17px}
.dl{display:block;text-align:center;background:var(--btn);color:var(--btn-t);text-decoration:none;font-weight:700;padding:14px;border-radius:12px;margin-top:10px}
.dl:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.back{display:inline-block;margin:6px 0 18px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--card);padding:10px 16px;border-radius:99px;font-weight:600}
.sec{font-size:22px;margin:0 0 16px}.hint{color:var(--mute);font-size:14px;text-align:center;margin:12px 0}
.ask{margin:0 0 12px;font-weight:600}
.issue{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;font:inherit;cursor:pointer}
.issue:focus-visible{outline:2px solid var(--acc)}
.issue b{flex:none;color:var(--acc);font-size:14px}
.contact{text-align:center;margin-top:16px}
.zalo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700}
.zalo svg{width:48px;height:48px;border-radius:12px}
.menu-btn{position:absolute;top:14px;left:14px;display:flex;align-items:center;justify-content:center;width:48px;height:48px;padding:0;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.menu-btn:focus-visible,.drop a:focus-visible{outline:2px solid var(--acc)}
.drop{position:absolute;top:70px;left:14px;z-index:30;min-width:200px;padding:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.drop a{display:block;padding:12px 14px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600}
.drop a:hover{background:var(--bg)}
.pop{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:10px;background:rgba(0,0,0,.72)}
.pop[hidden]{display:none}
.pop-box{width:min(98vw,760px);margin:auto}
.pop-img{position:relative}
.pop-box img{display:block;width:100%;height:auto;border-radius:18px}
.pop-x:focus-visible{outline:3px solid #fff}
.pop-xhit{position:absolute;top:1%;right:1%;width:9%;height:12%;padding:0;border:0;background:transparent;cursor:pointer}
.pop-x{position:absolute;top:-12px;right:-4px;display:flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;border-radius:50%;border:2px solid #fff;background:#1b1c21;color:#fff;font-size:22px;line-height:1;cursor:pointer}
.pop-skip{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.pop-skip input{flex:none;width:22px;height:22px;accent-color:#ffc400}
footer{text-align:center;color:var(--mute);font-size:13px;padding:20px 16px 30px}
</style>
</head>

const NOTICE = "Link No Vượt";

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const thumb = p => `<img class="cover" loading="lazy" decoding="async" src="${p.img || COVER}" style="object-position:${p.pos || "center"}${p.wide ? ";aspect-ratio:auto" : ""}" alt="${esc(p.title)}">`;

function home(){
  app.innerHTML = `<h1 class="sec">MOD ĐỒ</h1><div class="note">${esc(NOTICE)}</div>` + POSTS.filter(p => !p.cat).map(p => `
    <a class="card" href="#/${p.id}">
      ${thumb(p)}
      <h2>${esc(p.title)}</h2><p>${esc(p.char)}</p>
    </a>`).join("");
}

function detail(p){
  const group = (name, icon, links) => `<div class="box"><h3>${icon} ${name}</h3>` +
    p.versions.map(v => `<a class="dl" href="${esc(links[v] || "#")}" target="_blank" rel="noopener">${esc(v)}</a>`).join("") + `</div>`;
  app.innerHTML = `<article class="post">
    <h1>${esc(p.title)}</h1>
    ${thumb(p)}
    <div class="date">Ngày đăng: ${esc(p.date)}</div>
    <ul class="info"><li>🎭 ${esc(p.char)}</li><li>📦 Phiên bản hỗ trợ: ${esc(p.versions.join(", "))}</li></ul><div class="note">${p.note || (p.cat === "sung" ? "Link Vượt 1 Lần" : "Link No Vượt")}</div>
    ${group("Android","📱",p.android)}${group("iOS","🍎",p.ios)}
    <a class="back" href="${p.cat === "sung" ? "#/sung" : "#/"}">${p.cat === "sung" ? "← Quay lại MOD SÚNG" : "← Quay lại MOD ĐỒ"}</a></article>`;
}

function guns(){

/* ===== BÁO LỖI =====
   DB_URL: để trống thì số lượt báo lỗi chỉ lưu trên từng máy.
   Dán link Firebase vào đây (ví dụ "https://ten-du-an-default-rtdb.firebaseio.com")
   thì số lượt báo lỗi sẽ chung cho tất cả mọi người. */
const DB_URL = "https://vanquang-77dbc-default-rtdb.asia-southeast1.firebasedatabase.app";
const ZALO = "https://zaloapp.com/qr/p/p8pa8dlri07z?src=qr";
const ISSUES = [
  { k: "link", t: "Link bị hỏng, lỗi và không cài được" },
  { k: "skin", t: "Mod nhưng vào game không hiện skin" },
  { k: "mat", t: "Mod bị mất đồ và hiệu ứng trong trận" }
];
const store = {
  async count(k) {
    if (DB_URL) {
      try {
        const r = await fetch(`${DB_URL}/reports/${k}.json?shallow=true`);
        const d = await r.json();
        return d ? Object.keys(d).length : 0;
      } catch (e) { return null; }
    }
    try { return +localStorage.getItem("bl_n_" + k) || 0; } catch (e) { return 0; }
  },
  async add(k) {
    if (DB_URL) {
      try { await fetch(`${DB_URL}/reports/${k}.json`, { method: "POST", headers: { "Content-Type": "text/plain" }, body: String(Date.now()) }); } catch (e) {}
      return;
    }
    try { localStorage.setItem("bl_n_" + k, String((+localStorage.getItem("bl_n_" + k) || 0) + 1)); } catch (e) {}
  }
};
const showCount = async k => {
  const el = document.getElementById("n-" + k);
  if (!el) return;
  const n = await store.count(k);
  el.textContent = n === null ? "–" : n + " lượt";
};

function report(){
  app.innerHTML = `<h1 class="sec">Báo lỗi</h1>
    <p class="ask">Bạn đang gặp vấn đề gì?</p>
    ${ISSUES.map(i => `<button type="button" class="issue" data-k="${i.k}"><span>${esc(i.t)}</span><b id="n-${i.k}">…</b></button>`).join("")}
    <div id="thanks" class="note" hidden>Cảm ơn bạn đã báo lỗi, chúng tôi sẽ sớm fix lỗi này.</div>
    <div class="box contact"><h3>Liên hệ admin VanQuang qua</h3>
      <a class="zalo" href="${ZALO}" aria-label="Zalo của admin VanQuang">
        <svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#0068ff"/><text x="24" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#fff">Zalo</text></svg>
        <span>Zalo</span></a></div>
    <a class="back" href="#/">← Quay lại MOD ĐỒ</a>`;
  ISSUES.forEach(i => showCount(i.k));
  app.querySelectorAll(".issue").forEach(b => b.addEventListener("click", async () => {
    const k = b.dataset.k;
    let last = 0;
    try { last = +localStorage.getItem("bl_t_" + k) || 0; } catch (e) {}
    if (Date.now() - last > 864e5) {   /* mỗi máy chỉ tính 1 lượt/mục mỗi 24 giờ */
      await store.add(k);
      try { localStorage.setItem("bl_t_" + k, String(Date.now())); } catch (e) {}
      await showCount(k);
    }
    const t = document.getElementById("thanks");
    t.hidden = false;
    t.scrollIntoView({ behavior: "smooth", block: "center" });
  }));
}

function route(){
  const id = location.hash.replace("#/", "");
  const p = POSTS.find(x => x.id === id);
  id === "sung" ? guns() : id === "bao-loi" ? report() : p ? detail(p) : home();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* Menu 3 gạch: Báo lỗi */
const menuBtn = document.getElementById("menuBtn");
const menuDrop = document.getElementById("menuDrop");
const setMenu = open => { menuDrop.hidden = !open; menuBtn.setAttribute("aria-expanded", String(open)); };
menuBtn.addEventListener("click", e => { e.stopPropagation(); setMenu(menuDrop.hidden); });
document.addEventListener("click", e => { if (!menuDrop.contains(e.target)) setMenu(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape") setMenu(false); });
window.addEventListener("hashchange", () => setMenu(false));

/* Pop-up thông báo: hiện mỗi lần mở web (trừ khi khách tích không hiển thị hôm nay) */
const pop = document.getElementById("pop");
const popClose = document.getElementById("popClose");
const closePop = () => { pop.hidden = true; document.body.style.overflow = ""; };
const openPop = () => { pop.hidden = false; document.body.style.overflow = "hidden"; popClose.focus(); };
popClose.addEventListener("click", closePop);
document.querySelectorAll(".pop-xhit").forEach(b => b.addEventListener("click", closePop));
pop.addEventListener("click", e => { if (e.target === pop) closePop(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !pop.hidden) closePop(); });
const popKey = (() => { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); })();
const popSkip = document.getElementById("popSkip");
popSkip.addEventListener("change", () => {
  try { popSkip.checked ? localStorage.setItem("pop_skip_tb", popKey) : localStorage.removeItem("pop_skip_tb"); } catch (e) {}
});
let popSkipped = false;
try { popSkipped = localStorage.getItem("pop_skip_tb") === popKey; } catch (e) {}
if (!popSkipped) openPop();
/* Gỡ bản app cũ (nếu máy khách đã cài) để không bị lỗi khi các file app đã xóa */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
  if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
}
route();
</script>
