<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VanQuang</title>
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#17181c;--mute:#6b6e76;--line:#dcd8ce;--acc:#e4372c;--btn:#1f4fe0;--btn-t:#fff;--note:#e3efe6;--note-t:#1d5a34;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121316;--card:#1b1c21;--ink:#f2f2f4;--mute:#9a9da6;--line:#2c2e35;--acc:#ff5a4d;--btn:#2d5cf0;--note:#10302a;--note-t:#7fe0a8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121316;--card:#1b1c21;--ink:#f2f2f4;--mute:#9a9da6;--line:#2c2e35;--acc:#ff5a4d;--btn:#2d5cf0;--note:#10302a;--note-t:#7fe0a8;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
header{text-align:center;padding:22px 16px 10px}
.logo{font-size:26px;font-weight:800;letter-spacing:.06em;margin:0}
.logo{display:flex;align-items:center;justify-content:center;gap:12px}.mark{width:64px;height:64px;border-radius:16px;object-fit:cover;background:#fff}.cover{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.post .cover{border-radius:14px}
nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:6px 12px 14px;border-bottom:1px solid var(--line)}
nav a{color:var(--ink);text-decoration:none;padding:8px 14px;border-radius:99px;font-weight:600;font-size:15px}
nav a:hover,nav a:focus-visible{background:var(--card);outline:2px solid var(--acc)}
main{max-width:680px;margin:0 auto;padding:16px}
.note{background:var(--note);color:var(--note-t);border-radius:12px;padding:14px 16px;text-align:center;font-size:15px;margin-bottom:18px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px;text-decoration:none;color:inherit}
.card:focus-visible{outline:2px solid var(--acc)}
.thumb{aspect-ratio:16/9;display:flex;align-items:flex-end;padding:14px;color:#fff;font-weight:800;font-size:22px;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.card h2{font-size:18px;margin:14px 16px 2px;line-height:1.3}
.card p{margin:0 16px 14px;color:var(--mute);font-size:14px}
.post h1{font-size:22px;line-height:1.3;margin:0 0 12px}
.post .thumb{border-radius:14px}
.date{color:var(--mute);font-size:14px;margin:12px 0}
.info{list-style:none;padding:0;margin:0 0 18px}
.info li{padding:4px 0}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.box h3{margin:0 0 10px;font-size:17px}
.dl{display:block;text-align:center;background:var(--btn);color:var(--btn-t);text-decoration:none;font-weight:700;padding:14px;border-radius:12px;margin-top:10px}
.dl:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.back{display:inline-block;margin:6px 0 18px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--card);padding:10px 16px;border-radius:99px;font-weight:600}
footer{text-align:center;color:var(--mute);font-size:13px;padding:20px 16px 30px}
</style>
</head>

const NOTICE = "Chào mừng bạn! Nhấn vào bài đăng để xem chi tiết và tải về.";

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const thumb = p => `<img class="cover" src="${p.img || COVER}" alt="${esc(p.title)}">`;

function home(){
  app.innerHTML = `<div class="note">${esc(NOTICE)}</div>` + POSTS.map(p => `
    <a class="card" href="#/${p.id}">
      ${thumb(p)}
      <h2>${esc(p.title)}</h2><p>${esc(p.char)}</p>
    </a>`).join("");
}

function detail(p){
  const group = (name, icon, links) => `<div class="box"><h3>${icon} ${name}</h3>` +
    p.versions.map(v => `<a class="dl" href="${esc(links[v] || "#")}" target="_blank" rel="noopener">${esc(v)}</a>`).join("") + `</div>`;
  app.innerHTML = `<article class="post">
    <h1>${esc(p.title)}</h1>
    ${thumb(p)}
    <div class="date">Ngày đăng: ${esc(p.date)}</div>
    <ul class="info"><li>🎭 ${esc(p.char)}</li><li>📦 Phiên bản hỗ trợ: ${esc(p.versions.join(", "))}</li></ul>
    ${group("Android","📱",p.android)}${group("iOS","🍎",p.ios)}
    <a class="back" href="#/">← Quay lại trang chủ</a></article>`;
}

function route(){
  const id = location.hash.replace("#/", "");
  const p = POSTS.find(x => x.id === id);
  p ? detail(p) : home();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
